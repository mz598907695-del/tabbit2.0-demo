name: Release desktop update
run-name: Release ${{ inputs.version }} · ${{ inputs.publish && 'publish' || 'verify only' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: '新版本号，例如 0.1.10；必须高于已发布版本'
        required: true
        type: string
      notes:
        description: '更新说明'
        required: false
        default: '界面与体验优化。'
        type: string
      publish:
        description: '验证通过后公开发布；取消勾选则只构建验证'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: tabbit-team-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'mz598907695-del/tabbit2.0-demo' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_NOTES: ${{ inputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check runner and required secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TABBIT_RELEASE_TOKEN: ${{ secrets.TABBIT_RELEASE_TOKEN }}
          SHOULD_PUBLISH: ${{ inputs.publish }}
          RELEASE_APP_ID: ${{ vars.TABBIT_RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.TABBIT_RELEASE_APP_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import os, platform
          if platform.machine() != 'arm64':
              raise SystemExit('Apple Silicon runner required')
          required = ['TAURI_SIGNING_PRIVATE_KEY']
          if os.environ['SHOULD_PUBLISH'] == 'true':
              if os.environ.get('RELEASE_APP_ID'):
                  required.append('RELEASE_APP_PRIVATE_KEY')
              else:
                  required.append('TABBIT_RELEASE_TOKEN')
          for name in required:
              if not os.environ.get(name):
                  raise SystemExit('Missing repository secret: ' + name)
          PY
      - name: Install dependencies
        run: |
          npm ci
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: macos-arm64-release-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Prepare release version
        run: |
          node --input-type=module <<'JS'
          import { compareReleaseVersions, prepareReleaseVersion } from './scripts/prepare-release-version.mjs';
          const version=process.env.RELEASE_VERSION;
          compareReleaseVersions(version,version);
          const response=await fetch('https://api.github.com/repos/mz598907695-del/tabbit-demo-updates/releases/latest',{
            headers:{Accept:'application/vnd.github+json','User-Agent':'Tabbit-team-release'},
          });
          if(!response.ok)throw new Error(`Cannot verify latest public version: HTTP ${response.status}`);
          const release=await response.json();
          const latest=release.tag_name.replace(/^v/,'');
          if(compareReleaseVersions(version,latest)<=0)throw new Error(`Version must be newer than published ${latest}`);
          const result=prepareReleaseVersion({version});
          console.log(`Prepared ${result.previousVersion} → ${result.version}; latest public version is ${latest}.`);
          JS
      - name: Check source, tests and frontend build
        run: |
          npm run check
      - name: Build and sign update artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run release:update -- --bundled-defaults --notes "$RELEASE_NOTES"
      - name: Verify signed release artifacts
        run: node scripts/verify-update-artifacts.mjs --version "$RELEASE_VERSION"
      - name: Verify real native updater
        run: python3 scripts/test-updater-native.py
      - name: Save signed build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tabbit-${{ inputs.version }}-arm64
          if-no-files-found: error
          retention-days: 7
          path: |
            release/${{ inputs.version }}/*.dmg
            release/${{ inputs.version }}/*.app.tar.gz
            release/${{ inputs.version }}/*.app.tar.gz.sig
            release/${{ inputs.version }}/latest.json
      - name: Create update-repository App token
        id: release-app
        if: inputs.publish && vars.TABBIT_RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.TABBIT_RELEASE_APP_ID }}
          private-key: ${{ secrets.TABBIT_RELEASE_APP_PRIVATE_KEY }}
          owner: mz598907695-del
          repositories: tabbit-demo-updates
          permission-contents: write
      - name: Publish verified update
        if: inputs.publish
        env:
          TABBIT_RELEASE_TOKEN: ${{ steps.release-app.outputs.token || secrets.TABBIT_RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-update.py --publish
      - name: Verify public update endpoint
        if: inputs.publish
        run: |
          python3 - <<'PY'
          import json, os, time
          from urllib.request import Request, urlopen
          endpoint='https://github.com/mz598907695-del/tabbit-demo-updates/releases/latest/download/latest.json'
          for attempt in range(12):
              try:
                  request=Request(endpoint+'?verify='+os.environ['GITHUB_RUN_ID']+'-'+str(attempt),headers={'Cache-Control':'no-cache'})
                  with urlopen(request,timeout=30) as response:
                      manifest=json.load(response)
                  if manifest.get('version') == os.environ['RELEASE_VERSION']:
                      print('Public update endpoint verified:', manifest['version'])
                      break
              except (OSError, ValueError):
                  pass
              time.sleep(5)
          else:
              raise SystemExit('Public update endpoint did not return the published version; inspect the release before retrying.')
          PY
      - name: Write release summary
        env:
          SHOULD_PUBLISH: ${{ inputs.publish }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          version = os.environ['RELEASE_VERSION']
          published = os.environ['SHOULD_PUBLISH'] == 'true'
          message = f'## Tabbit {version}\n\n构建、签名和原生更新验证通过。\n\n'
          if published:
              message += f'[公开发布页](https://github.com/mz598907695-del/tabbit-demo-updates/releases/tag/v{version})\n'
          else:
              message += '仅构建验证，未公开发布；安装包见本次运行的 Artifacts。\n'
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as output:
              output.write(message)
          PY
