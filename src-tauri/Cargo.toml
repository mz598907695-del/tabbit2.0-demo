[package]
name = "tabbit-2-demo"
version = "0.1.4"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tabbit_2_demo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
window-vibrancy = "0.8.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", features = ["NSData"] }
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSImage", "NSBitmapImageRep", "NSImageRep", "NSView", "NSColor", "NSVisualEffectView", "NSBox", "NSAnimationContext", "NSHapticFeedback", "NSEvent", "block2"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "WKWebView", "WKSnapshotConfiguration", "objc2-app-kit", "objc2-core-foundation", "block2"] }
tokio = { version = "1", features = ["sync", "time"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# WebKit can throw an Objective-C exception when a video request is cancelled.
# Wry catches it, but the exception must unwind through Rust to reach that catch.
# Aborting here turns a normal wallpaper transition into a process crash.
panic = "unwind"
strip = true
